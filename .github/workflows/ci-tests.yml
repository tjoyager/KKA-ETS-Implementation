name: CI Tests & Packaging Verification

on:
  push:
    branches:
      - main
      - "feature/**"
      - "feat/**"
  pull_request:
    branches:
      - main

jobs:
  test-and-wheel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system OpenGL & Xvfb dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libgl1 libgl1-mesa-dri libglu1-mesa libegl1 \
            libx11-6 libxext6 libxrender1 libxrandr2 libxi6 libxcursor1 libxinerama1 libxxf86vm1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt build

      - name: Verify Python bytecode compilation
        run: python -m compileall -q src tests main.py

      - name: Run integration test suite
        env:
          PYTHONPATH: .
          LIBGL_ALWAYS_SOFTWARE: "1"
          KKA_DISABLE_AUDIO: "1"
        run: |
          for t in tests/test_full_suite.py tests/test_phase3_integration.py tests/test_phase4_integration.py; do
            echo ">>> Running $t"
            python -c "import runpy; from ursina import Ursina; Ursina(window_type='none'); runpy.run_path('$t', run_name='__main__')"
          done

      - name: Build wheel and verify zero-clone resource paths from /tmp
        run: |
          python -m build
          pip install --force-reinstall dist/*.whl
          cd /tmp
          python -c "
          from src.config import get_resource_root, MODEL_PATH_AGV
          from src.environment.asset_loader import AssetLoader
          root = get_resource_root()
          assert (root / MODEL_PATH_AGV).exists(), f'Missing bundled asset under {root}'
          assert AssetLoader.get_agv_model() == MODEL_PATH_AGV
          print('Wheel asset resolution OK:', root)
          "

  docker-build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image and run container test mode
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: kka-warehouse-sim:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run test suite inside built Docker container
        run: docker run --rm kka-warehouse-sim:ci test
