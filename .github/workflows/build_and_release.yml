name: Build and Release Standalone Executable

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Standalone Executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --clean --noconfirm build_app.spec

      - name: Archive build distribution (Zip)
        shell: pwsh
        run: |
          Compress-Archive -Path dist/KKA_Warehouse_AGV -DestinationPath dist/KKA_Warehouse_AGV_Windows.zip -Force
          Get-ChildItem -Path dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KKA_Warehouse_AGV_Windows
          path: dist/KKA_Warehouse_AGV_Windows.zip
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/KKA_Warehouse_AGV_Windows.zip
          name: "Release ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
